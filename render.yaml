# Render Blueprint: one web service serves the API and the web app (PC version).
# Create a free PostgreSQL on Neon (https://neon.tech) and paste its URL as DATABASE_URL.
services:
  - type: web
    name: gradelens
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
